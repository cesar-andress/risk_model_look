- grad_x_input
- line_occlusion
- integrated_gradients
prohibited_post_hoc:
- choose_ranking_by_rq1_results
- choose_ig_baseline_by_localization_or_faithfulness
- choose_attention_preset_by_test_attribution
- replace_2048_primary_with_4096_because_better
