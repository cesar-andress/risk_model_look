rq1:
  universe: POLICY_A_COMPLETE_CASE
  complete_case_n: 413
  primary_fully_visible_n_2048: 304
  ablation_fully_visible_n_4096: 345
  statuses_in_denominator:
  - RQ1_POSITIVE
  - RQ1_NEGATIVE
  exclude:
  - NOT_IN_RQ1_UNIVERSE
  ifa_indexing: ZERO_BASED_FALSE_ALARM_COUNT
  primary_rank_transform_signed_methods: ABS_DESCENDING
  primary_rank_transform_attention: RAW_DESCENDING
  sensitivity_rank_transform_signed_methods: SIGNED_POSITIVE_DESCENDING
  tie_break:
  - rank_score_DESC
  - ordered_position_ASC
  - stable_line_id_ASC
  truncated_commits_policy: DO_NOT_SCORE_PARTIAL_CANDIDATE_UNIVERSE_AS_PRIMARY
  construct:
    name: LOCALIZATION_PLAUSIBILITY_RELATIVE_TO_LINE_LABELS
    is_faithfulness: false
    wording: RQ1 measures localization/plausibility relative to line labels. It does NOT by itself establish
      explanation faithfulness. A method may faithfully explain a model that relies on non-defect evidence.
      Any cross-RQ conclusion must consider RQ1 jointly with RQ2.
    primary_endpoint: RECALL_AT_20_PERCENT_EFFORT
    secondary_endpoints:
    - Top-1
    - Top-5
    - Top-10
    - IFA
    - Effort@20%Recall
  trivial_baselines:
    B_LENGTH:
      definition: rank candidate lines by number of model-visible payload tokens descending
      role: PRIMARY_TRIVIAL_BASELINE
    B_ORDER:
      definition: rank by canonical ordered_position ascending
      role: PRIMARY_TRIVIAL_BASELINE
    B_RANDOM:
      definition: 100 deterministic random permutations (existing)
      role: PRIMARY_TRIVIAL_BASELINE
      repeats: 100
    B_ADD_FIRST:
      audit_name: ADD_FIRST_BASELINE_AUDIT_V1
      rule: If all RQ1 candidates are already added lines, mark ADD_FIRST_BASELINE=DEGENERATE_NOT_APPLICABLE;
        else rank ADD before other change types.
      status_if_all_added: DEGENERATE_NOT_APPLICABLE
  length_confound_diagnostic:
    name: ABS_ATTR_VS_PAYLOAD_TOKEN_COUNT_SPEARMAN
    unit: COMMIT
    role: CONFOUND_DIAGNOSTIC
    interprets_alone_as_invalidation: false
  signed_hit_diagnostic:
    name: NEGATIVE_HIT_RATE_AT_K
    ks:
    - 5
    - 10
    definition: Among labelled-positive lines in absolute top-k, fraction whose signed attribution is
      NEGATIVE
    role: RQ3_DIAGNOSTIC
    does_not_relabel_abs_hit_as_directional_success: true
aggregation:
  line_reduction_primary: SUM
  line_reduction_sensitivity: MEAN
  line_reduction_exploratory_only:
  - MAX_ABS_WITH_SIGN
  frozen: true
  rationale_sum: SUM preserves additive contribution/mass across tokens; MEAN is average per-token importance
    (different question).
attention:
  interpretation: INTERNAL_IMPORTANCE_PROXY_BASELINE
  primary_preset: ATTENTION_LAST_MEAN_HEAD
  sensitivity_preset: ATTENTION_LAST4_MEAN
  query_position_policy: FIRST_ASSISTANT_CLASSIFICATION_TOKEN
  primary_config:
    layer_selection: LAST
    head_aggregation: MEAN
    token_to_line: SUM
  sensitivity_config:
    layer_selection: FINAL_K_MEAN
    final_k: 4
    head_aggregation: MEAN
    token_to_line: SUM
  claim_language: Claims must say "the attention configurations evaluated here", not "attention in general".
methods_primary:
- id: A0_random_line
  role: PRIMARY
  family: random
  signed: false
- id: B_LENGTH
  role: PRIMARY_TRIVIAL_BASELINE
  family: trivial
  signed: false
- id: B_ORDER
  role: PRIMARY_TRIVIAL_BASELINE
  family: trivial
  signed: false
- id: A1_attention_last_mean_head
  role: PRIMARY
  family: attention
  signed: false
  preset: ATTENTION_LAST_MEAN_HEAD
- id: A2_vanilla_gradient
  role: SECONDARY
  family: gradient
  signed: true
- id: A3_grad_x_input
  role: PRIMARY
  family: gradient
  signed: true
- id: A4_integrated_gradients_zero
  role: PRIMARY
  family: ig
  signed: true
  baseline: ZERO_EMBEDDING
- id: A5_signed_line_occlusion
  role: PERTURBATION_REFERENCE
  family: occlusion
  signed: true
  unit: LINE
  perturbation_operator: SEGMENT_DELETE_V1
  rq2_role: PERTURBATION_REFERENCE
  rq2_confirmatory_holm_forbidden: true
  rq1_normal: true
  rq3_normal: true
methods_secondary:
- id: attention_last4_mean
  role: SECONDARY
  family: attention
  preset: ATTENTION_LAST4_MEAN
- id: integrated_gradients_pad
  role: SECONDARY
  family: ig
  baseline: PAD_TOKEN_EMBEDDING
- id: signed_positive_rq1_ranking
  role: SECONDARY
- id: line_reduction_mean
  role: SECONDARY
- id: faithfulness_probability_space
  role: SECONDARY
methods_ablation:
- id: occlusion_hunk
  role: ABLATION
  unit: HUNK
  perturbation_operator: SEGMENT_DELETE_V1
- id: representation_4096
  role: ABLATION
  max_length: 4096
  fully_visible_n: 345
- id: DIFF_POLARITY_SWAP_V1
  role: ABLATION
  rq: RQ4
ig:
  primary_baseline: ZERO_EMBEDDING
  secondary_baseline: PAD_TOKEN_EMBEDDING
  primary_baseline_caveat: 'ZERO_EMBEDDING is a canonical/reproducible baseline, NOT assumed semantically

    neutral for decoder LLMs (Jacobian Scopes arXiv:2601.16407; not JIT-specific).

    '
  pad_token:
    string: <|endoftext|>
    token_id: 151643
    is_special: true
    equals_bos_token_id: true
    equals_primary_eos_im_end: false
    primary_eos_string: <|im_end|>
    primary_eos_token_id: 151645
    also_listed_in_generation_eos_ids: true
    semantically_neutral_claim: false
  initial_steps: 50
  retry_steps: 100
  max_steps_without_orchestrator: 100
  integration_rule: GAUSS_LEGENDRE
  completeness:
    criterion_name: COMBINED_ABS_REL_TOL_V1_2
    E_abs: abs(attr_sum - target_delta)
    converged_if: E_abs <= max(1e-3, 0.05 * abs(target_delta))
    abs_floor_constant: 0.001
    relative_factor: 0.05
    record_both:
    - E_abs
    - E_rel
    legacy_relative_only: SUPERSEDED_FOR_V1_2_PRIMARY
  retry_policy: 'At 50 steps apply COMBINED_ABS_REL_TOL_V1_2. If not converged, retry 100 steps with the
    SAME criterion. If still fails: IG_NONCONVERGED.'
  nonconvergence_policy: 'IG_NONCONVERGED remains in other-method analyses; excluded only from analyses

    requiring valid IG; counted and reported; never replaced by another method.

    '
  result_policy: 'Primary tables use ZERO_EMBEDDING IG unless implementation failure before results.

    PAD is predeclared sensitivity. Do NOT choose the better-looking baseline post hoc.

    '
  common_complete_case_sensitivity:
    name: COMMON_COMPLETE_CASE_SENSITIVITY
    definition: commits where all compared primary methods are valid
    imputation: false
perturbation_operators:
  occlusion_attribution: SEGMENT_DELETE_V1
  faithfulness_evaluation_primary: PAYLOAD_BLANK_V1
  rationale: 'Occlusion attribution (A5) uses SEGMENT_DELETE_V1 (remove complete semantic

    segment: marker+payload, then re-render). Primary RQ2 faithfulness must NOT

    reuse the identical operator; PAYLOAD_BLANK_V1 blanks line/hunk payloads while

    retaining structural markers / chat wrapper so Comp/Suff/AOPC are not

    self-evaluating the same deletion operator used to define occlusion scores.

    '
occlusion:
  sign_convention: delta_R = s(x) - s(x_without_R)
  positive_means: supports_buggy_evidence
  negative_means: suppresses_buggy_evidence
  sign_inversion_forbidden: true
  perturbation_operator: SEGMENT_DELETE_V1
  line_removal: COMPLETE_SEMANTIC_LINE_SEGMENT
  hunk_removal: COMPLETE_HUNK_SEGMENT
  token_zeroing_forbidden: true
  re_render_re_tokenize: true
  empty_hunk_policy: REMOVE_EMPTY_HUNK
  empty_file_policy: REMOVE_EMPTY_FILE_IF_NO_HUNKS_OR_CHANGED_LINES
  retain_valid_chat_wrapper: true
  rq2_role: PERTURBATION_REFERENCE
  rq2_confirmatory_superiority_claims_forbidden: true
faithfulness:
  primary_score_space: LOGIT_CONTRAST
  secondary_score_space: RESTRICTED_BINARY_PROBABILITY
  full_vocabulary_probability_forbidden: true
  eraser_distinction: localization/plausibility != faithfulness
  perturbation_operator_primary: PAYLOAD_BLANK_V1
  perturbation_operator_sensitivity: SEGMENT_DELETE_V1
  primary_fractions:
  - 0.1
  - 0.2
  - 0.3
  - 0.5
  primary_budgeting:
    name: TOKEN_BUDGET_PREFIX_V1
    unit: MODEL_VISIBLE_PAYLOAD_TOKENS
    fractions:
    - 0.1
    - 0.2
    - 0.3
    - 0.5
    budget_tokens: max(1, ceil(f*T))
    selection: smallest_prefix_cumulative_tokens_ge_budget
    split_semantic_lines_forbidden: true
    record:
    - target_token_budget
    - realized_token_count
    - overshoot
  region_fraction_sensitivity:
    name: REGION_FRACTION_SENSITIVITY
    rounding: k = max(1, ceil(f * N_regions))
    role: SENSITIVITY_NOT_PRIMARY
    preserves_v1_1_intent: true
  absolute_perturbation_faithfulness:
    name: ABSOLUTE_PERTURBATION_FAITHFULNESS
    ABS_PERTURBATION_IMPACT_f: abs(s(x) - s(x_perturbed_f))
    ranking:
      signed_methods: ABS_DESCENDING
      attention: RAW_DESCENDING
      random_length_baselines: native_deterministic_ranking
    primary_endpoint: ABS_DELETION_AOPC
    ABS_DELETION_AOPC: mean_f ABS_PERTURBATION_IMPACT_f over frozen budgets
    interpretation: Higher = more prediction impact (direction-agnostic)
    do_not_call: signed_comprehensiveness
    is_primary_cross_method_rq2_endpoint: true
  directional_faithfulness:
    name: DIRECTIONAL_FAITHFULNESS
    POSITIVE_EVIDENCE_DROP_f: s(x) - s(x_perturbed_f)
    ranking: SIGNED_POSITIVE_DESCENDING
    applies_to: SIGNED_METHODS_ONLY
    role: SECONDARY_RQ3_LINKED
    attention_comparison_forbidden: true
  insertion:
    ABS_INSERTION_GAIN_f: abs(s(x_insert_f) - s(base))
    role: SECONDARY
    not_co_primary: true
  random_control:
    name: TOKEN_BUDGET_MATCHED_RANDOM_V1
    match: realized_perturbed_payload_token_count
    split_regions_forbidden: true
    record_abs_token_budget_difference: true
    repeats: 100
    compare_against_systematically_fewer_tokens: false
  operator_dependence_diagnostic:
    name: OPERATOR_DEPENDENCE_DIAGNOSTIC
    compare: ABS_DELETION_AOPC under PAYLOAD_BLANK_V1 vs SEGMENT_DELETE_V1
    occlusion_note: Does not eliminate all circularity
  deletion_curve_region_fraction_legacy_v1_1:
    role: REGION_FRACTION_SENSITIVITY
    definition: V1.1 region-count deletion curve retained as sensitivity
polarity:
  rule_name: RELATIVE_POLARITY_EPS_V1
  formula: 'M = max(abs(region_score)); epsilon = max(1e-8, 1e-6 * M);

    if M == 0: all NEAR_ZERO;

    POSITIVE if score > epsilon; NEGATIVE if score < -epsilon; else NEAR_ZERO.

    '
  apply_independently_to:
  - attribution_scores
  - occlusion_deltas
  sign_agreement_excludes_near_zero_on_either_side: true
  report:
  - agreement_coverage
  - overall_sign_agreement
  - positive_agreement
  - negative_agreement
  - near_zero_frequency
  rq3_attention_top2_hunks: &id001
    name: ATTENTION_TOP2_HUNK_OCCLUSION_SIGN_V1
    definition: 'Take top-2 hunks by primary attention aggregation (SUM of line attention within hunk,

      RAW_DESCENDING). For each, compute signed occlusion delta via SEGMENT_DELETE_V1

      at hunk granularity. Classify with RELATIVE_POLARITY_EPS_V1 on the set of those deltas

      (or per-commit hunk delta set including all hunks if needed for M).

      Report fraction of the top-2 whose class is NEGATIVE (occlusion delta < -eps),

      i.e. attention-highlighted hunks that suppress buggy evidence under occlusion.

      '
    near_zero_handling: exclude_from_negative_fraction_numerator_and_note_separately
missingness:
  name: METHOD_SPECIFIC_MISSINGNESS_V1_1
  rules:
  - id: IG_NONCONVERGED
    effect: exclude_only_from_analyses_requiring_valid_IG; count_and_report; never_replace_method
  - id: RQ1_TRUNCATED_COMMIT
    effect: exclude_from_primary_RQ1; eligible_for_RQ2_RQ3_RQ4_on_visible_regions
  - id: REGION_NOT_MODEL_VISIBLE
    effect: exclude_from_all_attribution_and_perturbation_for_that_commit_view
  - id: EMPTY_CANDIDATE_SET_AFTER_VISIBLE_FILTER
    effect: mark_COMMIT_NO_VISIBLE_CANDIDATES; exclude_from_metrics_requiring_regions; count_and_report
  - id: ATTENTION_QUERY_INDEX_UNRESOLVED
    effect: mark_ATTENTION_UNAVAILABLE; exclude_from_attention_analyses; count_and_report
  - id: OCCLUSION_RENDER_FAILURE
    effect: mark_OCCLUSION_UNAVAILABLE; exclude_from_occlusion_and_dependent_RQ3_cells; count_and_report
  prohibited:
  - silent_imputation
  - swap_in_alternate_method
  - drop_without_counting
rq4:
  inference_style: ESTIMATION_PLUS_CAUSAL_CATEGORY_ABLATIONS
  diff_polarity_swap:
    name: DIFF_POLARITY_SWAP_V1
    role: EXPLORATORY_STRUCTURAL_SENSITIVITY
    not_proof_of_shortcut_reliance: true
    removed_from_rq4_primary_holm: true
  test_file_category:
    status: DEFERRED_NOT_REQUIRED
    TEST_FILE_SUBANALYSIS: DEFERRED_NOT_REQUIRED
    removed_from_core_paper_protocol: true
  enrichment:
    name: ATTRIBUTION_ENRICHMENT_C
    token_share_C: tokens_in_C / total_model_visible_tokens
    abs_mass_share_C: abs_mass_C / total_abs_mass
    formula: abs_mass_share_C / token_share_C if token_share_C > 0
    interpretation:
      1: proportional
      gt1: enriched
      lt1: depleted
    gt1_alone_is_not_spurious: true
  categories_required:
  - COMMIT_MESSAGE
  - FILE_PATH
  - HUNK_HEADER
  - ADDED_CODE
  - DELETED_CODE
  - CONTEXT_CODE
  - STRUCTURAL_MARKUP
  - SPECIAL_TOKEN
  - PROMPT_INSTRUCTION
  prompt_template_alias: PROMPT_INSTRUCTION
  category_ablations:
    minimum:
    - COMMIT_MESSAGE
    - FILE_PATH
    - STRUCTURAL_MARKUP
    measure_primary: Delta_category = s(x) - s(x_without_category_information)
    measure_secondary: restricted_binary_probability_change
    tune_after_results_forbidden: true
  primary_reports:
  - category_token_share
  - category_abs_mass_share
  - enrichment
  - category_ablation_Delta_s
  giant_category_pvalue_matrix: false
random_baselines:
  rq1_repeats: 100
  seed_derivation: DETERMINISTIC_FROM_COMMIT_AND_REPEAT_INDEX
  faithfulness_seeds_independent: true
  no_result_dependent_reroll: true
execution_order_when_results_start:
- attention
