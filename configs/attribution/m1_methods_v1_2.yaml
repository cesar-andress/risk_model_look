- invert_occlusion_sign
- score_partial_truncated_universe_as_primary_rq1
- load_or_bind_intermediate_seed13_checkpoints_as_final
- use_SEGMENT_DELETE_as_primary_RQ2_operator
- choose_deletion_vs_insertion_AOPC_by_results
- freeze_test_file_regex_without_audit
- replace_RQ234_cohort_475_with_304_silently
- use_signed_drop_as_common_cross_method_rq2_primary
- compare_attention_on_directional_faithfulness
- claim_occlusion_wins_rq2_via_holm
- use_diff_polarity_swap_as_confirmatory_shortcut_proof
- call_rq1_faithfulness
- call_enrichment_gt1_spurious_without_perturbation
- use_wilcoxon_as_primary_for_binary_topk
- select_methods_by_validation_rehearsal_scores
- generalize_rq234_beyond_defect_inducing_without_negative_diagnostic
- impute_failed_ig
- change_primary_endpoints_after_seeing_test_results
