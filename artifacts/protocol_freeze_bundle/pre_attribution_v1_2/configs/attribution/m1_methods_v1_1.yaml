# ATTRIBUTION_PROTOCOL_V1.1 — Completeness Amendment (pre-result).
# Preserves V1 historically at:
#   configs/attribution/m1_methods_v1.yaml
#   artifacts/attribution_protocol/v1/
#   ATTRIBUTION_PROTOCOL_HASH_V1 = 73f0f891683f926a39d68b078f6e2770a1b42181ba1a9f56575c5556cba4794d
# Do NOT overwrite V1. Scientific runs after this amendment MUST carry V1.1 hash.

schema_version: "1.1"
protocol_id: ATTRIBUTION_PROTOCOL_V1_1
amends: ATTRIBUTION_PROTOCOL_V1
amended_from_hash: 73f0f891683f926a39d68b078f6e2770a1b42181ba1a9f56575c5556cba4794d
gate: ATTRIBUTION_PROTOCOL_AMENDMENT
attribution_infrastructure_gate: PASS
attribution_protocol_freeze_gate: PASS
attribution_results_gate: NOT_STARTED
rq1_results_gate: NOT_STARTED

model:
  model_id: Qwen/Qwen2.5-Coder-7B-Instruct
  revision: c03e6d358207e414f1eca0bb1891e29f1db0e242
  formulation: M1
  adapter_path: RESOLVE_FROM_M1_FINAL_MANIFEST
  seeds: [13, 42, 73]
  three_seed_policy: ALL_SEEDS_THEN_AGGREGATE

target:
  name: RISK_LOGIT_CONTRAST_V1
  formula: "s(x) = logit_1(x) - logit_0(x)"
  forbidden_primary: [probability, full_vocabulary_score, generated_token_likelihood, argmax_class]

representation:
  primary: CHANGED_ONLY
  primary_max_length: 2048
  ablation_max_length: 4096
  prompt_template_version: 1
  token_map_version: 1
  truncation: WHOLE_SEGMENT_PREFIX_TRUNCATION_V1

# --- Cohorts (V1.1 completeness) ---
cohorts:
  rq1_primary:
    name: RQ1_FULLY_VISIBLE_2048
    n: 304
    basis: POLICY_A_COMPLETE_CASE_FULLY_VISIBLE_CHANGED_ONLY_2048
    note: Unchanged from V1; truncated commits excluded from primary RQ1.
  rq1_complete_case_documented: 413
  rq1_ablation_4096_fully_visible: 345
  rq234_primary:
    name: ALL_POSITIVE_TEST_COMMITS
    n: 475
    basis: JIT_FINE_TEST_GOLD_POSITIVE_COMMITS
    truncated_policy: ELIGIBLE_ON_MODEL_VISIBLE_INPUT
    note: |
      RQ2/RQ3/RQ4 primary cohort is all 475 positive TEST commits.
      Truncated commits remain eligible; evaluations use only model-visible
      regions under WHOLE_SEGMENT_PREFIX_TRUNCATION_V1 (no silent partial RQ1).

rq1:
  universe: POLICY_A_COMPLETE_CASE
  complete_case_n: 413
  primary_fully_visible_n_2048: 304
  ablation_fully_visible_n_4096: 345
  statuses_in_denominator: [RQ1_POSITIVE, RQ1_NEGATIVE]
  exclude: [NOT_IN_RQ1_UNIVERSE]
  ifa_indexing: ZERO_BASED_FALSE_ALARM_COUNT
  primary_rank_transform_signed_methods: ABS_DESCENDING
  primary_rank_transform_attention: RAW_DESCENDING
  sensitivity_rank_transform_signed_methods: SIGNED_POSITIVE_DESCENDING
  tie_break:
    - rank_score_DESC
    - ordered_position_ASC
    - stable_line_id_ASC
  truncated_commits_policy: DO_NOT_SCORE_PARTIAL_CANDIDATE_UNIVERSE_AS_PRIMARY

aggregation:
  line_reduction_primary: SUM
  line_reduction_sensitivity: MEAN
  line_reduction_exploratory_only: [MAX_ABS_WITH_SIGN]
  frozen: true
  rationale_sum: "SUM preserves additive contribution/mass across tokens; MEAN is average per-token importance (different question)."

attention:
  interpretation: INTERNAL_IMPORTANCE_PROXY_BASELINE
  primary_preset: ATTENTION_LAST_MEAN_HEAD
  sensitivity_preset: ATTENTION_LAST4_MEAN
  query_position_policy: FIRST_ASSISTANT_CLASSIFICATION_TOKEN
  primary_config:
    layer_selection: LAST
    head_aggregation: MEAN
    token_to_line: SUM
  sensitivity_config:
    layer_selection: FINAL_K_MEAN
    final_k: 4
    head_aggregation: MEAN
    token_to_line: SUM
  claim_language: |
    Attention is an internal importance proxy / baseline.
    Do not describe raw attention as inherently faithful explanation.

methods_primary:
  - id: A0_random_line
    role: PRIMARY
    family: random
    signed: false
  - id: A1_attention_last_mean_head
    role: PRIMARY
    family: attention
    signed: false
    preset: ATTENTION_LAST_MEAN_HEAD
  - id: A2_vanilla_gradient
    role: PRIMARY
    family: gradient
    signed: true
  - id: A3_grad_x_input
    role: PRIMARY
    family: gradient
    signed: true
  - id: A4_integrated_gradients_zero
    role: PRIMARY
    family: ig
    signed: true
    baseline: ZERO_EMBEDDING
  - id: A5_signed_line_occlusion
    role: PRIMARY
    family: occlusion
    signed: true
    unit: LINE
    perturbation_operator: SEGMENT_DELETE_V1

methods_secondary:
  - id: attention_last4_mean
    role: SECONDARY
    family: attention
    preset: ATTENTION_LAST4_MEAN
  - id: integrated_gradients_pad
    role: SECONDARY
    family: ig
    baseline: PAD_TOKEN_EMBEDDING
  - id: signed_positive_rq1_ranking
    role: SECONDARY
  - id: line_reduction_mean
    role: SECONDARY
  - id: faithfulness_probability_space
    role: SECONDARY

methods_ablation:
  - id: occlusion_hunk
    role: ABLATION
    unit: HUNK
    perturbation_operator: SEGMENT_DELETE_V1
  - id: representation_4096
    role: ABLATION
    max_length: 4096
    fully_visible_n: 345
  - id: DIFF_POLARITY_SWAP_V1
    role: ABLATION
    rq: RQ4

ig:
  primary_baseline: ZERO_EMBEDDING
  secondary_baseline: PAD_TOKEN_EMBEDDING
  primary_baseline_caveat: |
    ZERO_EMBEDDING is a canonical/reproducible baseline, NOT assumed semantically
    neutral for decoder LLMs (Jacobian Scopes arXiv:2601.16407; not JIT-specific).
  pad_token:
    string: "<|endoftext|>"
    token_id: 151643
    is_special: true
    equals_bos_token_id: true
    equals_primary_eos_im_end: false
    primary_eos_string: "<|im_end|>"
    primary_eos_token_id: 151645
    also_listed_in_generation_eos_ids: true
    semantically_neutral_claim: false
  initial_steps: 50
  retry_steps: 100
  max_steps_without_orchestrator: 100
  integration_rule: GAUSS_LEGENDRE
  completeness:
    relative_tolerance: 0.05
    abs_floor_denominator: 1.0e-6
  retry_policy: |
    If E_rel > 0.05 at 50 steps, rerun SAME example at 100 steps.
    If E_rel <= 0.05 at 100, accept 100-step attribution.
    Else mark IG_NONCONVERGED for that baseline/example.
  nonconvergence_policy: |
    IG_NONCONVERGED remains in other-method analyses; excluded only from analyses
    requiring valid IG; counted and reported; never replaced by another method.
  result_policy: |
    Primary tables use ZERO_EMBEDDING IG unless implementation failure before results.
    PAD is predeclared sensitivity. Do NOT choose the better-looking baseline post hoc.

# --- Perturbation operators (V1.1 critical distinction) ---
perturbation_operators:
  occlusion_attribution: SEGMENT_DELETE_V1
  faithfulness_evaluation_primary: PAYLOAD_BLANK_V1
  rationale: |
    Occlusion attribution (A5) uses SEGMENT_DELETE_V1 (remove complete semantic
    segment: marker+payload, then re-render). Primary RQ2 faithfulness must NOT
    reuse the identical operator; PAYLOAD_BLANK_V1 blanks line/hunk payloads while
    retaining structural markers / chat wrapper so Comp/Suff/AOPC are not
    self-evaluating the same deletion operator used to define occlusion scores.

occlusion:
  sign_convention: "delta_R = s(x) - s(x_without_R)"
  positive_means: supports_buggy_evidence
  negative_means: suppresses_buggy_evidence
  sign_inversion_forbidden: true
  perturbation_operator: SEGMENT_DELETE_V1
  line_removal: COMPLETE_SEMANTIC_LINE_SEGMENT
  hunk_removal: COMPLETE_HUNK_SEGMENT
  token_zeroing_forbidden: true
  re_render_re_tokenize: true
  empty_hunk_policy: REMOVE_EMPTY_HUNK
  empty_file_policy: REMOVE_EMPTY_FILE_IF_NO_HUNKS_OR_CHANGED_LINES
  retain_valid_chat_wrapper: true

faithfulness:
  primary_score_space: LOGIT_CONTRAST
  secondary_score_space: RESTRICTED_BINARY_PROBABILITY
  full_vocabulary_probability_forbidden: true
  comprehensiveness: "COMP(R) = s(x) - s(x \\ R)"
  sufficiency_raw: "SUFF_RAW(R) = s(x) - s(R_only)"
  sufficiency_error: "SUFF_ERROR(R) = abs(s(x) - s(R_only))"
  eraser_distinction: "localization/plausibility != faithfulness"
  perturbation_operator_primary: PAYLOAD_BLANK_V1
  # V1.1: drop 5%; primary fractions frozen:
  primary_fractions: [0.10, 0.20, 0.30, 0.50]
  fraction_rounding: "k = max(1, ceil(f * N))"
  random_control: LENGTH_OR_CANDIDATE_COUNT_MATCHED
  random_seeds_independent_of_training: true
  deletion_curve:
    name: DELETION_CURVE_V1
    definition: |
      Rank regions by method rank_score. For each fraction f in primary_fractions,
      let k = max(1, ceil(f*N)). Apply PAYLOAD_BLANK_V1 to the top-k regions.
      Record s_f = s(x_blanked_top_k). Deletion drop D(f) = s(x) - s_f.
    aopc_summary: |
      AOPC_deletion = mean_f D(f) over primary_fractions
      (equivalently average comprehensiveness at those fractions).
  insertion_curve:
    name: INSERTION_CURVE_V1
    definition: |
      Start from fully blanked payloads (PAYLOAD_BLANK_V1 on all candidate regions),
      score s_empty. For each fraction f, restore (un-blank) the top-k regions by
      rank_score, k = max(1, ceil(f*N)). Record s_f_ins. Insertion gain
      I(f) = s_f_ins - s_empty.
    aopc_summary: |
      AOPC_insertion = mean_f I(f) over primary_fractions.
  aopc_note: Higher AOPC_deletion / AOPC_insertion indicates stronger faithfulness under the respective curve; report both; do not cherry-pick.

polarity:
  rule_name: RELATIVE_POLARITY_EPS_V1
  formula: |
    M = max(abs(region_score)); epsilon = max(1e-8, 1e-6 * M);
    if M == 0: all NEAR_ZERO;
    POSITIVE if score > epsilon; NEGATIVE if score < -epsilon; else NEAR_ZERO.
  apply_independently_to: [attribution_scores, occlusion_deltas]
  sign_agreement_excludes_near_zero_on_either_side: true
  report: [agreement_coverage, overall_sign_agreement, positive_agreement, negative_agreement, near_zero_frequency]
  rq3_attention_top2_hunks:
    name: ATTENTION_TOP2_HUNK_OCCLUSION_SIGN_V1
    definition: |
      Take top-2 hunks by primary attention aggregation (SUM of line attention within hunk,
      RAW_DESCENDING). For each, compute signed occlusion delta via SEGMENT_DELETE_V1
      at hunk granularity. Classify with RELATIVE_POLARITY_EPS_V1 on the set of those deltas
      (or per-commit hunk delta set including all hunks if needed for M).
      Report fraction of the top-2 whose class is NEGATIVE (occlusion delta < -eps),
      i.e. attention-highlighted hunks that suppress buggy evidence under occlusion.
    near_zero_handling: exclude_from_negative_fraction_numerator_and_note_separately

missingness:
  name: METHOD_SPECIFIC_MISSINGNESS_V1_1
  rules:
    - id: IG_NONCONVERGED
      effect: exclude_only_from_analyses_requiring_valid_IG; count_and_report; never_replace_method
    - id: RQ1_TRUNCATED_COMMIT
      effect: exclude_from_primary_RQ1; eligible_for_RQ2_RQ3_RQ4_on_visible_regions
    - id: REGION_NOT_MODEL_VISIBLE
      effect: exclude_from_all_attribution_and_perturbation_for_that_commit_view
    - id: EMPTY_CANDIDATE_SET_AFTER_VISIBLE_FILTER
      effect: mark_COMMIT_NO_VISIBLE_CANDIDATES; exclude_from_metrics_requiring_regions; count_and_report
    - id: ATTENTION_QUERY_INDEX_UNRESOLVED
      effect: mark_ATTENTION_UNAVAILABLE; exclude_from_attention_analyses; count_and_report
    - id: OCCLUSION_RENDER_FAILURE
      effect: mark_OCCLUSION_UNAVAILABLE; exclude_from_occlusion_and_dependent_RQ3_cells; count_and_report
  prohibited: [silent_imputation, swap_in_alternate_method, drop_without_counting]

rq4:
  diff_polarity_swap:
    name: DIFF_POLARITY_SWAP_V1
    definition: |
      Invert diff polarity by swapping ADD↔DEL semantic roles in the structured
      representation (change_type / markers), re-render/re-tokenize under the same
      prompt contract, and recompute attributions. Compare attribution mass /
      rankings under swap vs original. Prediction change is recorded but the probe
      asks whether attributions flip with polarity even when risk score is stable.
    role: ABLATION_PROBE
  test_file_category:
    status: PENDING_AUDIT
    classifier: DefaultUnknownClassifier
    note: |
      No audited test-path heuristic is frozen. Do not classify by '/test/' alone.
      Until an audited rule is accepted, test-file mass summaries remain UNKNOWN /
      PENDING and must not be reported as scientific TEST vs PRODUCTION splits.

random_baselines:
  rq1_repeats: 100
  seed_derivation: DETERMINISTIC_FROM_COMMIT_AND_REPEAT_INDEX
  faithfulness_seeds_independent: true
  no_result_dependent_reroll: true

execution_order_when_results_start:
  - attention
  - gradient
  - grad_x_input
  - line_occlusion
  - integrated_gradients

prohibited_post_hoc:
  - choose_ranking_by_rq1_results
  - choose_ig_baseline_by_localization_or_faithfulness
  - choose_attention_preset_by_test_attribution
  - replace_2048_primary_with_4096_because_better
  - select_best_m1_seed_by_test_performance
  - absolute_value_comprehensiveness_under_same_name
  - invert_occlusion_sign
  - score_partial_truncated_universe_as_primary_rq1
  - load_or_bind_intermediate_seed13_checkpoints_as_final
  - use_SEGMENT_DELETE_as_primary_RQ2_operator
  - choose_deletion_vs_insertion_AOPC_by_results
  - freeze_test_file_regex_without_audit
  - replace_RQ234_cohort_475_with_304_silently

outputs:
  raw_dir: data/results/attribution/
  schema: attribution_result_row_v1
  must_carry_protocol_hash: true
  protocol_version_field: ATTRIBUTION_PROTOCOL_V1_1
