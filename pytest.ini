[pytest]
testpaths = tests
pythonpath = .
addopts = -q
markers =
    cpu: CPU-safe unit tests (no 7B / no meaningful GPU allocation)
    gpu: GPU or large-model integration tests (forbidden during FULL_TRAINING_GATE)

# Default collection includes all tests; during active final training prefer:
#   CUDA_VISIBLE_DEVICES= python -m pytest -m "cpu or not gpu"
# Existing tests without markers are treated as CPU-safe unless marked gpu.
